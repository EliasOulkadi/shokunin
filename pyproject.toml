[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "shokunin-memory"
version = "4.2.2"
description = "Shokunin AI Ecosystem - Persistent Memory System"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=0.4.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "SIM", "PL"]
ignore = ["E501", "PLR2004", "SIM108"]

[tool.ruff.per-file-ignores]
"tests/*" = ["E402"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.11"
warn_unused_configs = true
explicit_package_bases = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
