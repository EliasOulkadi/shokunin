name: CI
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate SKILL.md frontmatter + required sections
        shell: bash
        run: |
          errors=0
          for dir in */; do
            f="${dir}SKILL.md"
            [ -f "$f" ] || continue
            n=$(basename "$dir")
            [ "$n" = "kami" ] && continue
            grep -q "^name:" "$f" || { echo "MISSING name: $n"; errors=$((errors+1)); }
            grep -qi "workflow\|structure\|60fps" "$f" || { echo "MISSING workflow: $n"; errors=$((errors+1)); }
            grep -qi "error\|emergency" "$f" || { echo "MISSING error: $n"; errors=$((errors+1)); }
            grep -qi "sources\|fuentes" "$f" || { echo "MISSING sources: $n"; errors=$((errors+1)); }
          done
          if [ "$errors" -gt 0 ]; then echo "FAILED: $errors"; exit 1; fi
          echo "All skills OK"

      - name: Validate JSON config
        shell: bash
        run: |
          python3 -c "import json; json.load(open('.pack/opencode.json')); print('Config valid')"

      - name: Validate bash scripts
        shell: bash
        run: |
          for s in .pack/scripts/linux/*.sh install.sh; do
            [ -f "$s" ] && bash -n "$s" || echo "SYNTAX ERROR: $s"
          done
          echo "All scripts OK"

      - name: Validate CLAUDE.md template
        shell: bash
        run: |
          grep -q "{{USERNAME}}" .pack/CLAUDE.md.template && echo "Template HAS USERNAME"
          grep -q "MEMORY SYSTEM" .pack/CLAUDE.md.template && echo "Template HAS MEMORY SYSTEM"
          echo "Template OK"
