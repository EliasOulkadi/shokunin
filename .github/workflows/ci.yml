name: CI
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate SKILL.md frontmatter
        shell: bash
        run: |
          errors=0
          for dir in */; do
            skill_file="${dir}SKILL.md"
            if [ -f "$skill_file" ]; then
              dir_name="$(basename "$dir")"
              skill_name="$(head -5 "$skill_file" | grep "^name:" | cut -d' ' -f2 | tr -d '[:space:]')"
              if [ "$skill_name" != "$dir_name" ]; then
                echo "MISMATCH: $skill_file has name='$skill_name' but dir is '$dir_name'"
                errors=$((errors+1))
              fi
            fi
          done
          if [ "$errors" -gt 0 ]; then
            echo "FAILED: $errors mismatches found"
            exit 1
          fi
          echo "All skills validated"
      - name: Validate JSON config
        shell: bash
        run: |
          if [ -f ".pack/opencode.json" ]; then
            python3 -c "
import json, sys
with open('.pack/opencode.json') as f:
    config = json.load(f)
required = ['provider', 'model', 'mcp', 'agent']
for r in required:
    if r not in config:
        print(f'MISSING: {r}')
        sys.exit(1)
print('Config valid')
"
          fi
